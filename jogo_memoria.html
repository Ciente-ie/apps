<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Memória — Ciente IE</title>
  <style>
    body {
      background: linear-gradient(to bottom, #0b1e3d, #142b57);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }
    h1 { color: #fff; margin-bottom: 10px; }
    #legenda {
      max-width: 600px;
      margin: 0 auto 20px auto;
      font-size: 15px;
      color: #dce3ff;
      background: rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
    }
    #areaJogo {
      width: 320px;
      height: 320px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
    }
    .cor {
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      opacity: 0.9;
    }
    .cor:hover { transform: scale(1.05); }
    .vermelho { background: #e11d48; }
    .azul { background: #2563eb; }
    .verde { background: #16a34a; }
    .amarelo { background: #facc15; color: #222; }
    .ativo { opacity: 1; box-shadow: 0 0 25px white; }
    #iniciar {
      background-color: #102853;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    #iniciar:hover { background-color: #1e3a8a; }
    #resultado {
      margin-top: 20px;
      font-size: 17px;
    }
    #status {
      margin-top: 10px;
      font-size: 16px;
      color: #c7d2fe;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🧩 Jogo de Memória</h1>
  <div id="legenda">
    👀 <b>Instruções:</b> Observe atentamente as luzes coloridas que piscam.<br>
    Quando aparecer “🎮 Sua vez!”, clique nas cores na mesma ordem.<br>
    A cada acerto a sequência aumenta. O jogo mostra o <b>nível alcançado</b> e o <b>tempo médio de reação</b>.
  </div>

  <button id="iniciar">▶️ Iniciar Jogo</button>
  <div id="status"></div>

  <div id="areaJogo">
    <div id="vermelho" class="cor vermelho"></div>
    <div id="azul" class="cor azul"></div>
    <div id="verde" class="cor verde"></div>
    <div id="amarelo" class="cor amarelo"></div>
  </div>
  <div id="resultado"></div>

  <script>
    const cores = ["vermelho", "azul", "verde", "amarelo"];
    const botoes = cores.map(c => document.getElementById(c));
    const iniciar = document.getElementById("iniciar");
    const resultado = document.getElementById("resultado");
    const statusTxt = document.getElementById("status");

    // frequências por cor
    const tons = {
      vermelho: 220,
      azul: 330,
      verde: 440,
      amarelo: 550
    };

    let sequencia = [];
    let entrada = [];
    let nivel = 1;
    let tempoInicio;
    let temposReacao = [];
    let aguardandoClique = false;
    let contextoAudio = null;

    // 🔊 desbloqueia som ao primeiro clique
    function initAudio() {
      if (!contextoAudio) {
        contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
        contextoAudio.resume();
      }
    }

    function tocarSom(frequencia, duracao = 300) {
      // recria um novo nó a cada som para evitar bloqueio
      if (!contextoAudio) initAudio();
      const osc = contextoAudio.createOscillator();
      const gain = contextoAudio.createGain();
      osc.type = "sine";
      osc.frequency.value = frequencia;
      osc.connect(gain);
      gain.connect(contextoAudio.destination);
      gain.gain.setValueAtTime(0.2, contextoAudio.currentTime);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, contextoAudio.currentTime + duracao / 1000);
      osc.stop(contextoAudio.currentTime + duracao / 1000);
    }

    function piscar(cor, comSom = true) {
      const btn = document.getElementById(cor);
      btn.classList.add("ativo");
      if (comSom) tocarSom(tons[cor]);
      setTimeout(() => btn.classList.remove("ativo"), 400);
    }

    async function mostrarSequencia() {
      aguardandoClique = false;
      statusTxt.textContent = "👁️ Observe a sequência...";
      for (let i = 0; i < sequencia.length; i++) {
        piscar(sequencia[i]);
        await new Promise(r => setTimeout(r, 700));
      }
      entrada = [];
      tempoInicio = performance.now();
      aguardandoClique = true;
      statusTxt.textContent = "🎮 Sua vez!";
    }

    function proximoNivel() {
      const novaCor = cores[Math.floor(Math.random() * 4)];
      sequencia.push(novaCor);
      resultado.textContent = `🟩 Nível ${nivel} — Memorize a sequência...`;
      setTimeout(mostrarSequencia, 800);
    }

    function verificarClique(cor) {
      if (!aguardandoClique) return;
      initAudio(); // garante contexto ativo
      const tempoReacao = (performance.now() - tempoInicio) / 1000;
      temposReacao.push(tempoReacao);
      tempoInicio = performance.now();

      const index = entrada.length;
      entrada.push(cor);
      piscar(cor);

      if (cor !== sequencia[index]) {
        piscar("vermelho", false);
        statusTxt.textContent = "❌ Sequência incorreta!";
        return finalizar(false);
      }

      if (entrada.length === sequencia.length) {
        nivel++;
        statusTxt.textContent = "✅ Sequência correta!";
        setTimeout(proximoNivel, 1000);
      }
    }

    function finalizar(sucesso = true) {
      aguardandoClique = false;
      const media = temposReacao.length ? (temposReacao.reduce((a,b)=>a+b,0)/temposReacao.length).toFixed(2) : 0;
      resultado.innerHTML = `
        🧠 <b>Jogo finalizado!</b><br>
        🎯 Nível alcançado: ${nivel - (sucesso ? 0 : 1)}<br>
        ⏱️ Tempo médio de reação: ${media}s
      `;
      statusTxt.textContent = "";
      iniciar.disabled = false;
    }

    iniciar.onclick = () => {
      initAudio();
      iniciar.disabled = true;
      sequencia = [];
      entrada = [];
      temposReacao = [];
      nivel = 1;
      resultado.textContent = "🔆 Observe a sequência inicial...";
      statusTxt.textContent = "👁️ Observe a sequência...";
      for (let i = 0; i < 3; i++) sequencia.push(cores[Math.floor(Math.random() * 4)]);
      setTimeout(mostrarSequencia, 1000);
    };

    botoes.forEach(btn => btn.addEventListener("click", () => {
      initAudio();
      verificarClique(btn.id);
    }));
  </script>
</body>
</html>
